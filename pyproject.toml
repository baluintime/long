[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nse-ichimoku"
version = "1.0.0"
description = "Screen every NSE-listed stock for closes above or below all Ichimoku lines"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "yfinance>=0.2.40",
    "requests>=2.31",
    "tabulate>=0.9",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
nse-ichimoku = "nse_ichimoku.cli:main"

[tool.setuptools]
packages = ["nse_ichimoku"]

[tool.pytest.ini_options]
testpaths = ["tests"]
